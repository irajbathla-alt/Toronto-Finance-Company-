<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin CRM | Toronto Finance Company</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet"><style>:root{--ink:#17130f;--paper:#f4eadc;--gold:#c6964e;--muted:#786f65;--line:rgba(23,19,15,.14)}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:'DM Sans',sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}.top{height:68px;padding:0 4vw;background:#17130f;color:white;display:flex;align-items:center;justify-content:space-between}.brand{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:300;text-transform:uppercase}.wrap{width:min(1280px,94vw);margin:32px auto}.login{width:min(420px,92vw);margin:80px auto;background:white;padding:28px;border-radius:12px}.login h1,h1,h2{font-family:'Cormorant Garamond',serif;font-weight:400;text-transform:uppercase}.field{margin-top:14px}.field label{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d4c8bb;border-radius:6px;padding:11px;background:#fbf7f0}.btn{border:0;border-radius:999px;background:#17130f;color:white;padding:12px 18px;text-transform:uppercase;letter-spacing:.1em;font-size:10px;cursor:pointer}.login .btn{width:100%;margin-top:18px}.admin{display:none}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric,.card{background:white;border-radius:9px;padding:18px;border:1px solid rgba(0,0,0,.05)}.metric strong{display:block;font-family:'Cormorant Garamond',serif;font-size:30px}.toolbar{display:flex;gap:10px;margin:15px 0}.toolbar input,.toolbar select{padding:10px;border:1px solid #d4c8bb;border-radius:6px;background:white}.tablewrap{overflow:auto;background:white;border-radius:9px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:13px;border-bottom:1px solid #eee;font-size:12px}th{font-size:9px;text-transform:uppercase;letter-spacing:.1em}.open{background:none;border:0;text-decoration:underline;cursor:pointer}.drawer{position:fixed;right:0;top:0;width:min(520px,100vw);height:100vh;background:white;box-shadow:-18px 0 50px rgba(0,0,0,.2);padding:24px;overflow:auto;transform:translateX(105%);transition:.3s;z-index:10}.drawer.show{transform:none}.close{float:right;border:0;background:none;font-size:24px}.kv{display:grid;grid-template-columns:145px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.notice{font-size:12px;color:var(--muted);margin-top:10px}@media(max-width:760px){.metrics{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{flex-direction:column}}</style></head><body><header class="top"><div class="brand">Toronto Finance Company · Admin</div><button class="btn" onclick="location.href='index.html'">Website</button></header><section id="login" class="login"><h1>Admin Login</h1><div class="field"><label>Email</label><input id="adminEmail" type="email"></div><div class="field"><label>Password</label><input id="adminPassword" type="password"></div><button class="btn" id="adminLogin">Log In</button><div id="loginMsg" class="notice"></div></section><main id="admin" class="wrap admin"><h1>Application CRM</h1><div class="metrics"><div class="metric"><span>All Files</span><strong id="mAll">0</strong></div><div class="metric"><span>Missing Statements</span><strong id="mMissing">0</strong></div><div class="metric"><span>Under Review</span><strong id="mReview">0</strong></div><div class="metric"><span>Decisions</span><strong id="mDecision">0</strong></div></div><div class="toolbar"><input id="search" placeholder="Search client or business"><select id="filter"><option value="">All statuses</option><option>New Application</option><option>Statements Required</option><option>Under Review</option><option>Conditional Approval</option><option>Approved</option><option>Funded</option><option>Declined</option></select><button class="btn" id="refresh">Refresh</button></div><div class="tablewrap"><table><thead><tr><th>Application</th><th>Client</th><th>Business</th><th>Status</th><th>Statements</th><th>Advisor</th><th>Updated</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main><aside class="drawer" id="drawer"><button class="close" id="close">×</button><h2 id="dTitle">Application</h2><div id="details"></div><h2>Admin Update</h2><div class="actions"><div class="field"><label>Status</label><select id="status"><option>New Application</option><option>Profile Completed</option><option>Statements Required</option><option>Ready for Review</option><option>Under Review</option><option>Additional Documents Required</option><option>Conditional Approval</option><option>Approved</option><option>Funded</option><option>Declined</option></select></div><div class="field"><label>Assigned Advisor</label><input id="advisor"></div><div class="field full"><label>Message Title</label><input id="messageTitle"></div><div class="field full"><label>Message to Client</label><textarea id="messageBody" rows="4"></textarea></div><div class="field"><label>Approved Amount</label><input id="approvedAmount" type="number"></div><div class="field"><label>Product / Terms</label><input id="quote"></div><div class="field full"><label>Internal Notes</label><textarea id="notes" rows="4"></textarea></div></div><button class="btn" id="save">Save Update</button><button class="btn" id="drive" style="margin-left:8px">Open Drive Folder</button><div id="saveMsg" class="notice"></div></aside><script src="crm-config.js"></script><script>const cfg=window.TFC_CONFIG||{};const demoApps=[{applicationId:'TFC-000101',name:'Demo Client',email:'demo@torontofinance.ca',phone:'416-555-0199',business:'Demo Foods Ltd.',status:'Statements Required',statements:0,advisor:'',updated:'Today',requested:100000,revenue:50000,driveUrl:'',messageTitle:'Statements Required',messageBody:'Please upload six statements.',approvedAmount:'',quote:'',notes:''}];let applications=[],selected=null;const $=s=>document.querySelector(s);function api(action,payload={}){if(cfg.demoMode||!cfg.apiUrl||cfg.apiUrl.includes('PASTE_'))return Promise.resolve({ok:true,data:action==='adminList'?demoApps:payload});return fetch(cfg.apiUrl,{method:'POST',body:JSON.stringify({action,...payload})}).then(r=>r.json())}function render(){const q=$('#search').value.toLowerCase(),f=$('#filter').value;const data=applications.filter(a=>(!f||a.status===f)&&(!q||`${a.name} ${a.business} ${a.applicationId}`.toLowerCase().includes(q)));$('#rows').innerHTML=data.map(a=>`<tr><td>${a.applicationId}</td><td>${a.name}<br><small>${a.email||''}</small></td><td>${a.business||'—'}</td><td>${a.status}</td><td>${a.statements||0}/6</td><td>${a.advisor||'—'}</td><td>${a.updated||''}</td><td><button class="open" data-id="${a.applicationId}">Open</button></td></tr>`).join('');document.querySelectorAll('.open').forEach(b=>b.onclick=()=>openFile(b.dataset.id));$('#mAll').textContent=applications.length;$('#mMissing').textContent=applications.filter(a=>(a.statements||0)<6).length;$('#mReview').textContent=applications.filter(a=>a.status==='Under Review').length;$('#mDecision').textContent=applications.filter(a=>['Conditional Approval','Approved','Funded','Declined'].includes(a.status)).length}async function load(){const r=await api('adminList');applications=r.data||[];render()}function openFile(id){selected=applications.find(a=>a.applicationId===id);$('#drawer').classList.add('show');$('#dTitle').textContent=`${selected.applicationId} · ${selected.business||selected.name}`;$('#details').innerHTML=[['Client',selected.name],['Email',selected.email],['Phone',selected.phone],['Business',selected.business],['Requested',selected.requested?`CA$${Number(selected.requested).toLocaleString()}`:'—'],['Revenue',selected.revenue?`CA$${Number(selected.revenue).toLocaleString()}`:'—'],['Statements',`${selected.statements||0}/6`]].map(x=>`<div class="kv"><b>${x[0]}</b><span>${x[1]||'—'}</span></div>`).join('');['status','advisor','messageTitle','messageBody','approvedAmount','quote','notes'].forEach(k=>$('#'+k).value=selected[k]||'')}$('#save').onclick=async()=>{const update={applicationId:selected.applicationId};['status','advisor','messageTitle','messageBody','approvedAmount','quote','notes'].forEach(k=>update[k]=$('#'+k).value);const r=await api('adminUpdate',update);if(r.ok){Object.assign(selected,update,{updated:'Now'});render();$('#saveMsg').textContent='Client dashboard and CRM updated.'}else $('#saveMsg').textContent=r.error||'Update failed'};$('#drive').onclick=()=>selected?.driveUrl?window.open(selected.driveUrl,'_blank'):alert('Drive folder will appear after Google Apps Script setup.');$('#close').onclick=()=>$('#drawer').classList.remove('show');$('#search').oninput=render;$('#filter').onchange=render;$('#refresh').onclick=load;$('#adminLogin').onclick=async()=>{const r=await api('adminLogin',{email:$('#adminEmail').value,password:$('#adminPassword').value});if(r.ok){$('#login').style.display='none';$('#admin').style.display='block';load()}else $('#loginMsg').textContent=r.error||'Login failed'};if(cfg.demoMode){$('#adminEmail').value='admin@torontofinance.ca';$('#adminPassword').value='admin1234'}</script></body></html>
