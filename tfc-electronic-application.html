<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TFC Electronic Application Test | Toronto Finance Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<style>
:root{--ink:#17130f;--cream:#f7f0e6;--paper:#fffdf9;--gold:#c6964e;--muted:#786f65;--line:rgba(23,19,15,.14)}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(circle at 70% 15%,rgba(198,150,78,.18),transparent 32%),linear-gradient(135deg,#17130f,#211a13 58%,#110e0b);font-family:"DM Sans",sans-serif;color:var(--ink);padding:28px 16px}
.shell{width:min(560px,100%);margin:auto;background:rgba(247,240,230,.99);border:1px solid rgba(255,255,255,.18);box-shadow:0 28px 80px rgba(0,0,0,.35);border-radius:18px;overflow:hidden}
.top{padding:24px 26px 18px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-family:"Cormorant Garamond",serif;font-size:31px;line-height:.92;font-weight:300;text-transform:uppercase}.brand span{display:block}
.tag{margin-top:12px;color:#9b763f;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.container{padding:22px 26px 30px;text-align:center}
.progress-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#9d9184}
.back{border:0;background:transparent;padding:8px 0;color:var(--ink);font:inherit;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.bar{height:3px;border-radius:999px;background:rgba(23,19,15,.10);overflow:hidden;margin-bottom:28px}.bar i{display:block;height:100%;background:var(--gold);transition:width .28s ease}
.kicker{font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#9b763f;margin-bottom:9px}
h1,h2,h3{font-family:"Cormorant Garamond",serif;font-weight:400;text-transform:uppercase}
h2{font-size:26px;line-height:1.02;margin:0 0 28px;white-space:nowrap;letter-spacing:-.01em}
.help{font-size:12px;line-height:1.6;color:var(--muted);margin:0 auto 22px;max-width:430px}
.question{min-height:410px;display:flex;flex-direction:column;justify-content:flex-start}
.choices{display:grid;gap:10px;margin-top:18px}
.choice{width:100%;min-height:58px;padding:15px 17px;border:1px solid rgba(109,84,58,.18);border-radius:13px;background:linear-gradient(180deg,rgba(255,253,249,.98),rgba(248,241,231,.9));color:#211a14;box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 7px 20px rgba(73,51,28,.05);font:500 12px "DM Sans",sans-serif;cursor:pointer;transition:.18s}
.choice:hover,.choice.selected{transform:translateY(-1px);border-color:rgba(171,126,65,.66);background:linear-gradient(180deg,#fffaf0,#f2dfc4)}
.field-wrap{margin-top:20px;text-align:left}
.field-wrap label{display:block;margin:0 0 8px;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#665e55;white-space:nowrap}
.field-wrap input,.field-wrap select,.field-wrap textarea{width:100%;padding:15px 14px;border:1px solid #cfc3b5;background:#fbf7f0;border-radius:10px;color:var(--ink);font:16px "DM Sans",sans-serif;outline:none}
.field-wrap textarea{min-height:92px;resize:vertical}
.field-wrap input:focus,.field-wrap select:focus,.field-wrap textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(198,150,78,.12)}
.primary{width:100%;margin-top:18px;padding:15px 18px;background:var(--ink);color:#fff;border:0;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.primary:hover{background:#2a2119;transform:translateY(-1px)}
.primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.tap-hint{margin-top:12px;font-size:9px;color:#9b9085}
.review{text-align:left}
.review h3{font-size:28px;margin:0 0 6px;text-align:center}
.review-intro{text-align:center;margin:0 0 18px;color:var(--muted);font-size:11px}
.review-group{border-top:1px solid var(--line);padding:14px 0 4px}.review-group:first-of-type{border-top:0}
.review-group strong{display:block;margin-bottom:9px;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#9b763f}
.row{display:grid;grid-template-columns:minmax(150px,.95fr) minmax(0,1.4fr);gap:12px;padding:7px 0;border-bottom:1px solid rgba(23,19,15,.06);font-size:11px;line-height:1.4}.row span:first-child{color:var(--muted);white-space:nowrap}.row span:last-child{text-align:right;font-weight:600;overflow-wrap:anywhere}
.consent{margin-top:16px;padding:14px;border:1px solid rgba(198,150,78,.28);border-radius:12px;background:#fffaf2;font-size:10px;line-height:1.55;color:#655a50}
.notice{margin-top:13px;font-size:9px;line-height:1.5;color:#8a7e72}
.signbox{margin-top:16px;text-align:left}
.signbox label{display:block;margin-bottom:8px;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#665e55}
.signature-wrap{background:#fff;border:1px solid #cfc3b5;border-radius:12px;overflow:hidden}
#signaturePad{display:block;width:100%;height:170px;touch-action:none;background:#fff}
.sign-actions{display:flex;justify-content:flex-end;margin-top:7px}
.text-btn{border:0;background:transparent;color:#8a6736;font:600 9px "DM Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;padding:7px 0}
.consent-check{display:flex;align-items:flex-start;gap:10px;margin-top:15px;text-align:left;font-size:10px;line-height:1.5;color:#655a50}
.consent-check input{width:17px;height:17px;margin-top:1px;accent-color:#17130f}
.success-card{padding:26px 8px;text-align:center}
.success-mark{width:54px;height:54px;border:1px solid rgba(198,150,78,.55);border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;font-size:22px;color:#9b763f}
.secondary{width:100%;margin-top:10px;padding:14px 18px;background:transparent;color:var(--ink);border:1px solid rgba(23,19,15,.28);border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.10em;text-transform:uppercase;cursor:pointer}
.hidden{display:none!important}
@media(max-width:520px){body{padding:0}.shell{min-height:100vh;border-radius:0}.container,.top{padding-left:20px;padding-right:20px}.brand{font-size:28px}.question{min-height:0}h2{font-size:20px;white-space:nowrap;margin-bottom:28px}.field-wrap{margin-top:20px}.field-wrap label{font-size:8px;letter-spacing:.04em}.row{grid-template-columns:minmax(120px,.9fr) minmax(0,1.1fr);gap:8px;font-size:10px}.row span:first-child{white-space:nowrap}.row span:last-child{text-align:right}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span>Toronto</span><span>Finance Company</span></div>
    <div class="tag">Business Financing Application</div>
  </header>
  <main class="container">
    <div class="progress-head">
      <button type="button" class="back" id="backBtn">← Back</button>
      <span id="stepText">1 / 12</span>
    </div>
    <div class="bar"><i id="progressBar"></i></div>
    <section class="question" id="question"></section>
  </main>
</div>
<script>
(()=>{
  const FORMSUBMIT_AJAX='https://formsubmit.co/ajax/info@torontofinancecompany.com';
  const openedAt=new Date().toISOString();
  let lastPdfBlob=null, lastPdfName='', lastAudit=null;
  const q=document.getElementById('question'), back=document.getElementById('backBtn'), stepText=document.getElementById('stepText'), bar=document.getElementById('progressBar');

  const fields=[
    {key:'legalName',adobe:'1',section:'Business Information',kicker:'About your business',title:'What is the legal business name?',label:'Legal Business Name',type:'text',placeholder:'Enter legal business name'},
    {key:'nature',adobe:'2',section:'Business Information',kicker:'About your business',title:'What industry is your business in?',label:'Nature of Business',type:'select',placeholder:'Select your industry',options:['Restaurant / Café / Food Service','Retail / Convenience / Liquor','Construction / Trades','Trucking / Transportation','Automotive / Repair / Welding','Medical / Clinic / Health','Professional Services','Manufacturing / Wholesale','Beauty / Personal Care','Cleaning / Janitorial','Travel / Tourism','Financial Services','Other']},
    {key:'employees',adobe:'3',section:'Business Information',kicker:'Business profile',title:'How many employees does the business have?',label:'Number of Employees',type:'number',min:'0',placeholder:'Enter number of employees'},
    {key:'revenue',adobe:'4',section:'Business Information',kicker:'Business revenue',title:'What was your revenue over the last 12 months?',label:'Annual Revenue (Last 12 Months)',type:'number',min:'0',placeholder:'Enter annual revenue',money:true},
    {key:'businessAddress',adobe:'5',section:'Business Information',kicker:'Business location',title:'What is the business address?',label:'Business Address',type:'textarea',placeholder:'Street, city, province, postal code'},
    {key:'registrationYear',adobe:'undefined',section:'Business Information',kicker:'Business history',title:'What year was the business registered?',label:'Business Registration Year',type:'number',min:'1900',max:String(new Date().getFullYear()),placeholder:'e.g. 2024'},
    {key:'bank',adobe:'Business Bank Account TDRBCBMOScotia',section:'Business Information',kicker:'Business banking',title:'Where is your main business bank account?',label:'Business Bank Account',type:'choices',options:['TD','RBC','BMO','Scotiabank','CIBC','Other']},

    {key:'ownerName',adobe:'1_2',section:'Business Owner Information',kicker:'Business owner',title:'What is the owner’s full legal name?',label:'First Name & Last Name',type:'text',placeholder:'Enter full legal name'},
    {key:'dob',adobe:'2_2',section:'Business Owner Information',kicker:'Business owner',title:'What is the owner’s date of birth?',label:'Date of Birth',type:'date'},
    {key:'phone',adobe:'3_2',section:'Business Owner Information',kicker:'Contact information',title:'What is the best phone number?',label:'Phone Number',type:'tel',placeholder:'604-555-5555'},
    {key:'email',adobe:'1_3',section:'Business Owner Information',kicker:'Contact information',title:'What is the owner’s email address?',label:'Email Address',type:'email',placeholder:'name@example.com'},
    {key:'ownerAddress',adobe:'2_3',section:'Business Owner Information',kicker:'Business owner',title:'What is the owner’s home address?',label:'Address',type:'textarea',placeholder:'Street, city, province, postal code'},

  ];

  const data={};
  let index=0;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
  const displayMoney=v=>{const n=Number(v||0);return n?'$'+Math.round(n).toLocaleString('en-CA'):''};
  const displayDate=v=>{if(!v)return'';const [y,m,d]=v.split('-');return [m,d,y].filter(Boolean).join('/')};

  function currentValue(f){return data[f.key]??''}
  function setProgress(review=false){
    const total=fields.length+1;
    const n=review?total:index+1;
    stepText.textContent=n+' / '+total;
    bar.style.width=(n/total*100)+'%';
    back.style.visibility=index===0&&!review?'hidden':'visible';
  }

  function valid(f,v){
    if(f.optional)return true;
    if(f.type==='email')return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    if(f.type==='number')return v!==''&&Number(v)>=Number(f.min||0);
    return String(v).trim()!=='';
  }

  function next(){
    if(index<fields.length-1){index++;render()}
    else renderReview();
  }

  function commitAndNext(){
    const f=fields[index];
    const el=document.getElementById('fieldInput');
    const v=el?el.value:'';
    if(!valid(f,v)){el&&el.focus();return}
    data[f.key]=v;
    next();
  }

  function render(){
    const f=fields[index];
    setProgress(false);
    let control='';
    if(f.type==='choices'){
      control='<div class="choices">'+f.options.map(o=>'<button type="button" class="choice'+(currentValue(f)===o?' selected':'')+'" data-value="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div><div class="tap-hint">Tap an option to continue</div>';
    }else if(f.type==='textarea'){
      control='<div class="field-wrap"><label>'+esc(f.label)+'</label><textarea id="fieldInput" placeholder="'+esc(f.placeholder||'')+'">'+esc(currentValue(f))+'</textarea></div><button type="button" class="primary" id="nextBtn">Continue ⟶</button>';
    }else if(f.type==='select'){
      control='<div class="field-wrap"><label>'+esc(f.label)+'</label><select id="fieldInput"><option value="">'+esc(f.placeholder||'Select')+'</option>'+f.options.map(o=>'<option value="'+esc(o)+'"'+(currentValue(f)===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div><button type="button" class="primary" id="nextBtn">Continue ⟶</button>';
    }else{
      const val=currentValue(f);
      control='<div class="field-wrap"><label>'+esc(f.label)+(f.optional?' · Optional':'')+'</label><input id="fieldInput" type="'+esc(f.type)+'" '+(f.min?'min="'+esc(f.min)+'" ':'')+(f.max?'max="'+esc(f.max)+'" ':'')+'placeholder="'+esc(f.placeholder||'')+'" value="'+esc(val)+'"></div><button type="button" class="primary" id="nextBtn">Continue ⟶</button>';
    }

    q.innerHTML='<div class="kicker">'+esc(f.kicker)+'</div><h2>'+esc(f.title)+'</h2>'+(f.money?'<p class="help">Enter the approximate gross business revenue for the most recent 12 months.</p>':'')+control;

    if(f.type==='choices'){
      q.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>{data[f.key]=btn.dataset.value;setTimeout(next,120)}));
    }else{
      const input=document.getElementById('fieldInput');
      document.getElementById('nextBtn').addEventListener('click',commitAndNext);
      input.addEventListener('keydown',e=>{if(e.key==='Enter'&&f.type!=='textarea'){e.preventDefault();commitAndNext()}});
      setTimeout(()=>input.focus(),30);
    }
  }

  function renderReview(){
    setProgress(true);
    const groups=['Business Information','Business Owner Information'];
    const rows=groups.map(group=>{
      const items=fields.filter(f=>f.section===group).map(f=>{
        let v=data[f.key]||'';
        if(f.money)v=displayMoney(v);
        if(f.type==='date')v=displayDate(v);
        if(!v)v='Not provided';
        return '<div class="row"><span>'+esc(f.label)+'</span><span>'+esc(v)+'</span></div>';
      }).join('');
      return '<div class="review-group"><strong>'+esc(group)+'</strong>'+items+'</div>';
    }).join('');

    q.innerHTML='<div class="review"><div class="kicker" style="text-align:center">Review & sign</div><h3>Electronic Application</h3><p class="review-intro">Please review your information, accept the authorization, and sign below.</p>'+rows+
      '<div class="consent">By signing below, I confirm that the information provided is true, accurate and complete, and I agree to the Toronto Finance Company credit check and consent authorization contained in this application.</div>'+
      '<label class="consent-check"><input type="checkbox" id="creditConsentCheck"><span><strong>Credit Check & Consent Authorization:</strong> I have reviewed and agree to the credit, banking, financial information and authorization terms shown above.</span></label>'+
      '<label class="consent-check"><input type="checkbox" id="communicationConsentCheck"><span><strong>Communication Consent:</strong> I consent to being contacted by Toronto Finance Company by email, telephone, text message, or other electronic means regarding my application and financing opportunities.</span></label>'+
      '<label class="consent-check"><input type="checkbox" id="esignConsentCheck"><span>I agree to use an electronic signature for this submission.</span></label>'+
      '<div class="signbox"><label>Draw your signature</label><div class="signature-wrap"><canvas id="signaturePad"></canvas></div><div class="sign-actions"><button type="button" class="text-btn" id="clearSig">Clear signature</button></div></div>'+
      '<button type="button" class="primary" id="submitSigned">Sign & Submit Application ⟶</button>'+
      '<div class="notice" id="submitNotice">A completed TFC application PDF and electronic signature audit trail will be generated and sent through FormSubmit.</div></div>';

    initSignaturePad();
    document.getElementById('submitSigned').addEventListener('click',submitSignedApplication);
  }

  function initSignaturePad(){
    const canvas=document.getElementById('signaturePad');
    const wrap=canvas.parentElement;
    const ratio=Math.max(window.devicePixelRatio||1,1);
    const rect=wrap.getBoundingClientRect();
    canvas.width=Math.round(rect.width*ratio);
    canvas.height=Math.round(170*ratio);
    canvas.style.width=rect.width+'px';
    canvas.style.height='170px';
    const ctx=canvas.getContext('2d');
    ctx.scale(ratio,ratio);
    ctx.lineWidth=2;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.strokeStyle='#17130f';
    let drawing=false, hasInk=false;
    const point=e=>{
      const r=canvas.getBoundingClientRect();
      const src=e.touches?e.touches[0]:e;
      return {x:src.clientX-r.left,y:src.clientY-r.top};
    };
    const begin=e=>{e.preventDefault();drawing=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)};
    const move=e=>{if(!drawing)return;e.preventDefault();const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();hasInk=true};
    const stop=e=>{if(drawing&&e)e.preventDefault();drawing=false};
    canvas.addEventListener('pointerdown',begin);
    canvas.addEventListener('pointermove',move);
    window.addEventListener('pointerup',stop,{once:false});
    canvas.addEventListener('touchstart',begin,{passive:false});
    canvas.addEventListener('touchmove',move,{passive:false});
    canvas.addEventListener('touchend',stop,{passive:false});
    canvas.getSignature=()=>hasInk?canvas.toDataURL('image/png'):'';
    document.getElementById('clearSig').addEventListener('click',()=>{
      ctx.clearRect(0,0,canvas.width/ratio,canvas.height/ratio);
      hasInk=false;
    });
  }

  function makeDocumentId(){
    const d=new Date();
    const stamp=d.toISOString().replace(/[-:TZ.]/g,'').slice(0,14);
    const rand=Math.random().toString(36).slice(2,8).toUpperCase();
    return 'TFC-ESIGN-'+stamp+'-'+rand;
  }

  async function publicIp(){
    try{
      const r=await fetch('https://api.ipify.org?format=json',{cache:'no-store'});
      if(!r.ok)return 'Unavailable';
      const j=await r.json();
      return j.ip||'Unavailable';
    }catch(e){return 'Unavailable'}
  }

  async function sha256(text){
    try{
      const bytes=new TextEncoder().encode(text);
      const hash=await crypto.subtle.digest('SHA-256',bytes);
      return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){return 'Unavailable'}
  }

  function wrapPdfText(doc,text,x,y,maxWidth,lineHeight){
    const lines=doc.splitTextToSize(String(text||''),maxWidth);
    doc.text(lines,x,y);
    return y+(lines.length*lineHeight);
  }

  async function buildSignedPdf(signatureData){
    if(!window.jspdf||!window.jspdf.jsPDF)throw new Error('PDF engine unavailable');
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:'pt',format:'letter'});
    const docId=makeDocumentId();
    const signedAt=new Date().toISOString();
    const ip=await publicIp();
    const auditBase={
      documentId:docId,
      signer:data.ownerName||'',
      email:data.email||'',
      phone:data.phone||'',
      signatureMethod:'Drawn electronic signature',
      creditConsentAccepted:true,
      communicationConsentAccepted:true,
      electronicSignatureConsentAccepted:true,
      openedAt,
      signedAt,
      ipAddress:ip,
      userAgent:navigator.userAgent||'Unavailable',
      platform:navigator.platform||'Unavailable',
      language:navigator.language||'Unavailable',
      screen:(window.screen?window.screen.width+' x '+window.screen.height:'Unavailable'),
      pageUrl:location.href
    };
    const canonical=JSON.stringify({application:data,audit:auditBase,signature:signatureData});
    const integrity=await sha256(canonical);
    const audit={...auditBase,documentIntegrityHash:integrity};
    lastAudit=audit;

    const left=54,right=558,width=right-left;
    doc.setTextColor(23,19,15);
    doc.setFont('times','normal');
    doc.setFontSize(19);
    doc.text('TORONTO FINANCE COMPANY',306,56,{align:'center'});
    doc.setFontSize(10);
    doc.text('SMALL BUSINESS FINANCING',306,74,{align:'center'});
    doc.setDrawColor(198,150,78);
    doc.line(left,88,right,88);

    doc.setFont('helvetica','bold');doc.setFontSize(10);
    doc.text('BUSINESS INFORMATION',left,116);
    doc.setFont('helvetica','normal');doc.setFontSize(9);
    let y=138;
    const appRows=[
      ['Legal Business Name',data.legalName],
      ['Nature of Business',data.nature],
      ['No. of Employees',data.employees],
      ['Annual Revenue (Last 12 Months)',displayMoney(data.revenue)],
      ['Business Address',data.businessAddress],
      ['Business Registration Year',data.registrationYear],
      ['Business Bank Account',data.bank]
    ];
    for(const [label,val] of appRows){
      doc.setFont('helvetica','bold');doc.text(label+':',left,y);
      doc.setFont('helvetica','normal');
      y=wrapPdfText(doc,val||'Not provided',220,y,338,11)+9;
    }

    y+=5;doc.setFont('helvetica','bold');doc.text('BUSINESS OWNER INFORMATION',left,y);y+=22;
    const ownerRows=[
      ['First Name & Last Name',data.ownerName],
      ['Date of Birth',displayDate(data.dob)],
      ['Phone Number',data.phone],
      ['Email Address',data.email],
      ['Address',data.ownerAddress]
    ];
    for(const [label,val] of ownerRows){
      doc.setFont('helvetica','bold');doc.text(label+':',left,y);
      doc.setFont('helvetica','normal');
      y=wrapPdfText(doc,val||'Not provided',220,y,338,11)+9;
    }

    if(y>520){doc.addPage();y=60}
    y+=7;doc.setFont('helvetica','bold');doc.text('CREDIT CHECK & CONSENT AUTHORIZATION',left,y);y+=18;
    doc.setFont('helvetica','normal');doc.setFontSize(8);
    const consent='Each person signing below declares that all information provided in this Business Financing Application is true, accurate, and complete. I/We authorize Toronto Finance Company, its affiliated companies, partner lenders, funding providers, Authorized Agents, and designated representatives — including, but not limited to, DUCA Financial Credit Union, Merchant Growth, Sheaves Capital, KM Capital, Canacap Funding, Journey Capital, Driven, iCapital, Vancity, and Xuper Funding — to obtain, verify, exchange, and disclose personal, business, financial, banking, and credit information as reasonably required to assess, arrange, obtain, or service financing or other financial products on my/our behalf. I/We authorize Toronto Finance Company Inc. and its designated representatives to obtain credit bureau reports and, where reasonably required in connection with my/our financing request, additional credit reports or credit-monitoring information for up to 12 months from the date of this consent. I/We also consent to being contacted by Toronto Finance Company by email, telephone, text message, or other electronic means regarding my/our application, financing opportunities, products, services, renewals, updates, and related financial information. Marketing consent may be withdrawn at any time, subject to communications otherwise permitted or required by law. I/We agree that an electronic or photocopied version of this consent shall have the same validity as the original. I/We consent to the collection, use, and disclosure of my/our personal and business information in accordance with Toronto Finance Company’s Privacy & Consent Policy, available at: https://torontofinancecompany.com/privacy.html';
    y=wrapPdfText(doc,consent,left,y,width,10)+10;

    if(y>625){doc.addPage();y=70}
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('Electronic Signature',left,y);y+=9;
    doc.setDrawColor(180,170,160);doc.rect(left,y,250,72);
    try{doc.addImage(signatureData,'PNG',left+8,y+8,234,56)}catch(e){}
    y+=88;
    doc.setFont('helvetica','normal');
    doc.text('Signatory: '+(data.ownerName||''),left,y);
    doc.text('Date: '+new Date(signedAt).toLocaleString('en-CA'),left+280,y);

    doc.addPage();
    doc.setFont('times','normal');doc.setFontSize(18);
    doc.text('ELECTRONIC SIGNATURE AUDIT TRAIL',306,58,{align:'center'});
    doc.setFont('helvetica','normal');doc.setFontSize(8.5);
    doc.setDrawColor(198,150,78);doc.line(left,72,right,72);
    let ay=100;
    const auditRows=[
      ['Document ID',audit.documentId],
      ['Signer Full Name',audit.signer],
      ['Signer Email',audit.email],
      ['Signer Phone',audit.phone],
      ['Signature Method',audit.signatureMethod],
      ['Credit Consent',audit.creditConsentAccepted?'Accepted at '+audit.signedAt:'Not accepted'],
      ['Communication Consent',audit.communicationConsentAccepted?'Accepted at '+audit.signedAt:'Not accepted'],
      ['Electronic Signature Consent',audit.electronicSignatureConsentAccepted?'Accepted at '+audit.signedAt:'Not accepted'],
      ['Form Opened',audit.openedAt],
      ['Signed / Submitted',audit.signedAt],
      ['Signer IP',audit.ipAddress],
      ['Browser / Device',audit.userAgent],
      ['Platform',audit.platform],
      ['Language',audit.language],
      ['Screen Size',audit.screen],
      ['Page URL',audit.pageUrl],
      ['Document Integrity Hash (SHA-256)',audit.documentIntegrityHash]
    ];
    for(const [label,val] of auditRows){
      doc.setFont('helvetica','bold');doc.text(label,left,ay);
      doc.setFont('helvetica','normal');
      ay=wrapPdfText(doc,val||'Unavailable',205,ay,350,10)+11;
      if(ay>735){doc.addPage();ay=60}
    }
    doc.setFont('helvetica','italic');doc.setFontSize(8);
    wrapPdfText(doc,'This audit record was generated by the Toronto Finance Company web application at the time of electronic submission.',left,ay+8,width,10);

    return {blob:doc.output('blob'),name:docId+'.pdf',audit};
  }

  async function sendViaFormSubmit(pdf){
    const payload=new FormData();
    payload.append('_subject','Signed TFC Business Financing Application - '+(data.legalName||data.ownerName||'Applicant'));
    payload.append('_template','table');
    payload.append('_captcha','false');
    payload.append('_replyto',data.email||'');
    payload.append('Document ID',pdf.audit.documentId);
    payload.append('Legal Business Name',data.legalName||'');
    payload.append('Nature of Business',data.nature||'');
    payload.append('Owner Name',data.ownerName||'');
    payload.append('Owner Email',data.email||'');
    payload.append('Owner Phone',data.phone||'');
    payload.append('Credit Consent Accepted','Yes');
    payload.append('Communication Consent Accepted','Yes');
    payload.append('Electronic Signature Consent Accepted','Yes');
    payload.append('Signed At',pdf.audit.signedAt);
    payload.append('Signer IP',pdf.audit.ipAddress);
    payload.append('Document Integrity Hash',pdf.audit.documentIntegrityHash);
    payload.append('Source','Toronto Finance Company Electronic Application Test');
    payload.append('Signed Application PDF',pdf.blob,pdf.name);
    const res=await fetch(FORMSUBMIT_AJAX,{method:'POST',body:payload,headers:{Accept:'application/json'}});
    if(!res.ok)throw new Error('FormSubmit request failed');
    return res.json().catch(()=>({success:true}));
  }

  async function submitSignedApplication(){
    const creditConsent=document.getElementById('creditConsentCheck');
    const communicationConsent=document.getElementById('communicationConsentCheck');
    const esignConsent=document.getElementById('esignConsentCheck');
    const canvas=document.getElementById('signaturePad');
    const signature=canvas&&canvas.getSignature?canvas.getSignature():'';
    const btn=document.getElementById('submitSigned');
    const notice=document.getElementById('submitNotice');
    if(!creditConsent.checked){notice.textContent='Please accept the Credit Check & Consent Authorization before submitting.';return}
    if(!communicationConsent.checked){notice.textContent='Please accept the communication consent before submitting.';return}
    if(!esignConsent.checked){notice.textContent='Please accept the electronic signature consent before submitting.';return}
    if(!signature){notice.textContent='Please draw your signature before submitting.';return}
    btn.disabled=true;btn.textContent='Generating Signed Application…';
    notice.textContent='Creating your signed application and audit trail…';
    try{
      const pdf=await buildSignedPdf(signature);
      lastPdfBlob=pdf.blob;lastPdfName=pdf.name;
      btn.textContent='Sending Application…';
      notice.textContent='Sending the completed PDF to Toronto Finance Company…';
      await sendViaFormSubmit(pdf);
      renderSuccess();
    }catch(err){
      console.error(err);
      btn.disabled=false;btn.textContent='Sign & Submit Application ⟶';
      notice.textContent='We could not complete the submission. Please try again.';
    }
  }

  function renderSuccess(){
    stepText.textContent='Complete';
    bar.style.width='100%';
    back.style.visibility='hidden';
    q.innerHTML='<div class="success-card"><div class="success-mark">✓</div><div class="kicker">Application submitted</div><h2>Thank You</h2><p class="help">Your signed Toronto Finance Company application and electronic signature audit trail have been generated and sent.</p><button type="button" class="secondary" id="downloadPdf">Download My Signed Copy</button><div class="notice">Document ID: '+esc(lastAudit?lastAudit.documentId:'')+'</div></div>';
    document.getElementById('downloadPdf').addEventListener('click',()=>{
      if(!lastPdfBlob)return;
      const url=URL.createObjectURL(lastPdfBlob);
      const a=document.createElement('a');
      a.href=url;a.download=lastPdfName||'TFC-Signed-Application.pdf';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    });
  }

  back.addEventListener('click',()=>{
    if(index>0){index--;render()}
  });

  render();
})();
</script>
</body>
</html>
